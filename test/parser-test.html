<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>בדיקות לניתוח הטקסט</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; margin: 20px; background: #f7f7f7; color: #111; }
  h1 { font-size: 1.1rem; }
  #summary { font-weight: 700; font-size: 1rem; margin: 10px 0 16px; }
  table { border-collapse: collapse; width: 100%; background: #fff; font-size: .86rem; }
  th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: start; vertical-align: top; }
  tr.pass td:first-child { color: #15803d; font-weight: 700; }
  tr.fail { background: #fef2f2; }
  tr.fail td:first-child { color: #b91c1c; font-weight: 700; }
  code { direction: ltr; unicode-bidi: embed; font-size: .82rem; }
</style>
</head>
<body>
<h1>בדיקות לניתוח הטקסט</h1>
<p id="summary">מריץ…</p>
<table>
  <thead><tr><th>מצב</th><th>קלט</th><th>פערים</th><th>תוצאה</th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<script>
/* קוד האפליקציה נטען עם מניעת מטמון, כדי שהבדיקות ירוצו תמיד על הקוד הנוכחי. */
function loadScript(src) {
  return new Promise(function (resolve, reject) {
    var tag = document.createElement("script");
    tag.src = src + "?r=" + Date.now() + Math.random();
    tag.onload = resolve;
    tag.onerror = function () { reject(new Error("נכשלה טעינת " + src)); };
    document.head.appendChild(tag);
  });
}
loadScript("../js/lexicon.js")
  .then(function () { return loadScript("../js/parse.js"); })
  .then(function () { runTests(); })
  .catch(function (err) { document.getElementById("summary").textContent = String(err.message || err); });
</script>
<script>
/* שעת עוגן קבועה לבדיקות: שבת 26.9.2026, 14:30. */
var NOW = new Date(2026, 8, 26, 14, 30, 0, 0);

var CASES = [
  { input: 'אכלתי 2 פרוסות לחם עם אבוקדו',
    expect: [{ type: 'food', amount: 2, unit: 'slice', name: 'לחם עם אבוקדו' }] },
  { input: '100 גרם אורז',
    expect: [{ type: 'food', amount: 100, unit: 'g', name: 'אורז' }] },
  { input: 'שתיתי 250 מ"ל קפה עם חלב בשעה 8:15',
    expect: [{ type: 'food', amount: 250, unit: 'ml', name: 'קפה עם חלב', hour: 8, minute: 15 }] },
  { input: 'קפה שחור',
    expect: [{ type: 'food', amount: null, name: 'קפה שחור', missing: 'amount' }] },
  { input: 'רצתי 5 ק"מ ב-32 דקות',
    expect: [{ type: "workout", name: "ריצה", durationMin: 32, note: "5 ק\"מ", missing: "" }] },
  { input: 'חדר כושר שעה וחצי, 3 סטים של 12 חזרות',
    expect: [
      { type: 'workout', name: 'חדר כושר', durationMin: 90 },
      { type: "workout", name: "אימון", missing: "effort" }
    ] },
  { input: 'התאמנתי',
    expect: [{ type: 'workout', name: 'אימון', missing: 'effort' }] },
  { input: 'אתמול בערב אכלתי חצי מנה פסטה',
    expect: [{ type: 'food', amount: 0.5, unit: 'serving', name: 'פסטה', hour: 20, dayShift: -1, meal: 'dinner' }] },
  { input: '10000 צעדים',
    expect: [{ type: 'workout', name: 'הליכה', steps: 10000, missing: '' }] },
  { input: '2 תפוחים',
    expect: [{ type: 'food', amount: 2, unit: 'unit', name: 'תפוחים' }] },
  { input: 'כוס קפה',
    expect: [{ type: 'food', amount: 1, unit: 'cup', name: 'קפה' }] },
  { input: 'לפני שעתיים אכלתי 3 ביצים',
    expect: [{ type: 'food', amount: 3, name: 'ביצים', hour: 12, minute: 30 }] },
  { input: 'רצתי חצי שעה',
    expect: [{ type: 'workout', name: 'ריצה', durationMin: 30 }] },
  { input: 'ארוחת בוקר 2 ביצים',
    expect: [{ type: 'food', amount: 2, meal: 'breakfast', name: 'ביצים' }] },
  { input: 'שתיתי 1.5 ליטר מים',
    expect: [{ type: 'food', amount: 1.5, unit: 'l', name: 'מים' }] },
  { input: 'אכלתי סלט, ורצתי 3 ק"מ',
    expect: [
      { type: 'food', name: 'סלט', missing: 'amount' },
      { type: "workout", name: "ריצה", missing: "effort" }
    ] },
  { input: 'אכלתי ב-8 בבוקר חביתה',
    expect: [{ type: 'food', name: 'חביתה', hour: 8, missing: 'amount' }] },
  { input: 'יוגה 45 דקות',
    expect: [{ type: 'workout', name: 'יוגה', durationMin: 45 }] },
  { input: 'שכיבות סמיכה 3 על 15',
    expect: [{ type: "workout", name: "שכיבות סמיכה", missing: "effort" }] },
  { input: 'חצי אבטיח',
    expect: [{ type: 'food', amount: 0.5, unit: 'unit', name: 'אבטיח' }] },
  { input: 'שחיתי 40 דקות בבריכה',
    expect: [{ type: 'workout', name: 'שחייה', durationMin: 40 }] },

  /* פיצול ארוחה מרובת מרכיבים לרשומות נפרדות */
  { input: 'אכלתי אורז, חזה עוף וסלט',
    expect: [
      { type: 'food', name: 'אורז' },
      { type: 'food', name: 'חזה עוף' },
      { type: 'food', name: 'סלט' }
    ] },
  { input: 'אכלתי 100 גרם אורז ו-150 גרם חזה עוף',
    expect: [
      { type: 'food', name: 'אורז', amount: 100, unit: 'g' },
      { type: 'food', name: 'חזה עוף', amount: 150, unit: 'g' }
    ] },
  { input: 'שתיתי קפה ואכלתי עוגייה',
    expect: [
      { type: 'food', name: 'קפה' },
      { type: 'food', name: 'עוגייה' }
    ] },
  /* ו' שאינה מפרידה: חלק מהמילה, או השלמה של כמות */
  { input: 'אכלתי גלידה וניל',
    expect: [{ type: 'food', name: 'גלידה וניל' }] },
  { input: 'רצתי שעה וחצי',
    expect: [{ type: 'workout', name: 'ריצה', durationMin: 90 }] },
  { input: 'שתיתי 250 מ"ל קפה עם חלב',
    expect: [{ type: 'food', name: 'קפה עם חלב', amount: 250, unit: 'ml' }] },

  /* מספר במילים שנושא אות שימוש — נפוץ מאוד בהכתבה */
  { input: 'רצתי בשלושים דקות',
    expect: [{ type: 'workout', name: 'ריצה', durationMin: 30 }] },
  { input: 'רצתי חמישה קילומטר בשלושים דקות',
    expect: [{ type: "workout", name: "ריצה", durationMin: 30 }] },
  { input: 'אכלתי כחמש פרוסות לחם',
    expect: [{ type: 'food', name: 'לחם', amount: 5, unit: 'slice' }] },

  /* ארוחה שהוכתבה בלי פיסוק ובלי ו' החיבור: כל פריט נפתח בכמות, וזה הגבול.
     המשפט הזה הגיע ממנוע ההכתבה בטלפון בדיוק כך. */
  { input: 'שלושה שניצל כוס מיץ תפוזים שתי כפות אורז',
    expect: [
      { type: 'food', name: 'שניצל', amount: 3, unit: 'unit' },
      { type: 'food', name: 'מיץ תפוזים', amount: 1, unit: 'cup' },
      { type: 'food', name: 'אורז', amount: 2, unit: 'tbsp' }
    ] },
  { input: '100 גרם אורז 200 גרם עוף',
    expect: [
      { type: 'food', name: 'אורז', amount: 100, unit: 'g' },
      { type: 'food', name: 'עוף', amount: 200, unit: 'g' }
    ] },
  /* כמות שבאה אחרי השם אינה פריט חדש */
  { input: 'תפוח אחד',
    expect: [{ type: 'food', name: 'תפוח', amount: 1, unit: 'unit' }] },
  { input: 'אכלתי ביצה אחת',
    expect: [{ type: 'food', name: 'ביצה', amount: 1, unit: 'unit' }] },

  /* אימונים בניסוח מדובר */
  { input: 'עכשיו סיימתי אימון של שעתיים',
    expect: [{ type: 'workout', name: 'אימון', durationMin: 120, note: '' }] },
  { input: 'סיימתי הרגע אימון בן שעה',
    expect: [{ type: 'workout', name: 'אימון', durationMin: 60, note: '' }] },
  { input: 'הלכתי שעה',
    expect: [{ type: 'workout', name: 'הליכה', durationMin: 60 }] },
  /* מספר מורכב: ו' שבתוכו אינה מפצלת, והערך מחובר */
  { input: 'רצתי חמישה קילומטר בשלושים ושתיים דקות',
    expect: [{ type: "workout", name: "ריצה", durationMin: 32 }] },
  { input: 'יוגה ארבעים וחמש דקות',
    expect: [{ type: 'workout', name: 'יוגה', durationMin: 45 }] },
  { input: 'מאה ועשרים גרם אורז',
    expect: [{ type: 'food', name: 'אורז', amount: 120, unit: 'g' }] },
  /* אלפים, ושם פעילות מפורש שגובר על הפועל הכללי */
  { input: 'הלכתי עשרת אלפים צעדים',
    expect: [{ type: 'workout', name: 'הליכה', steps: 10000 }] },
  { input: 'התאמנתי בחדר כושר שעה וחצי',
    expect: [{ type: 'workout', name: 'חדר כושר', durationMin: 90, note: '' }] },
  { input: 'אימון בטן עשרים דקות',
    expect: [{ type: 'workout', name: 'כפיפות בטן', durationMin: 20, note: '' }] },
  { input: 'רכבתי על אופניים עשרים קילומטר',
    expect: [{ type: "workout", name: "אופניים", missing: "effort" }] },

  /* לאימון יש התחלה וסוף, והניסוח קובע באיזה קצה נאמר המשפט.
     שעת העוגן של הבדיקות היא 14:30. */
  { input: 'עכשיו סיימתי אימון של שעתיים',
    expect: [{ type: 'workout', name: 'אימון', durationMin: 120, hour: 12, minute: 30, endHour: 14 }] },
  { input: 'מתחיל אימון של שעתיים',
    expect: [{ type: 'workout', name: 'אימון', durationMin: 120, hour: 14, minute: 30, endHour: 16 }] },
  { input: 'רצתי חצי שעה',
    expect: [{ type: 'workout', name: 'ריצה', durationMin: 30, hour: 14, minute: 0, endHour: 14 }] },
  /* שעה מפורשת היא שעת ההתחלה */
  { input: 'רצתי בשעה 8 חצי שעה',
    expect: [{ type: 'workout', name: 'ריצה', durationMin: 30, hour: 8, minute: 0, endHour: 8 }] },

  /* משך מורכב: שבר של היחידה, או דקות שמתווספות לשעה */
  { input: 'אימון של שעה ורבע',
    expect: [{ type: 'workout', name: 'אימון', durationMin: 75 }] },
  { input: 'התאמנתי שעה ועשרים',
    expect: [{ type: 'workout', name: 'אימון', durationMin: 80 }] },
  { input: 'אימון של שעתיים ורבע',
    expect: [{ type: 'workout', name: 'אימון', durationMin: 135 }] },
  { input: 'רצתי שתיים וחצי שעות',
    expect: [{ type: 'workout', name: 'ריצה', durationMin: 150 }] },
  { input: 'אימון של שלושת רבעי שעה',
    expect: [{ type: 'workout', name: 'אימון', durationMin: 45 }] },
  { input: 'רצתי שתי שעות ועשרים',
    expect: [{ type: 'workout', name: 'ריצה', durationMin: 140 }] },

  /* אותו משך בלי ו' החיבור, כפי שאומרים שעה וארבעים */
  { input: 'אימון של שעה ארבעים',
    expect: [{ type: 'workout', name: 'אימון', durationMin: 100 }] },
  { input: 'התאמנתי שעה ארבעים דקות',
    expect: [{ type: 'workout', name: 'אימון', durationMin: 100, note: '' }] },
  { input: 'רצתי שתי שעות ארבעים',
    expect: [{ type: 'workout', name: 'ריצה', durationMin: 160 }] },
  /* מספר חשוף אחרי יחידת זמן הוא דקות — אלא אם הוא מרחק */
  { input: 'רצתי שעה 5 קילומטר',
    expect: [{ type: "workout", name: "ריצה", durationMin: 60 }] }
];

function actualValue(rec, key) {
  var date = new Date(rec.ts);
  if (key === 'hour') return date.getHours();
  if (key === 'minute') return date.getMinutes();
  /* שעת הסיום נגזרת: תחילת האימון ועוד המשך שלו */
  if (key === 'endHour') {
    if (!rec.durationMin) return null;
    return new Date(date.getTime() + rec.durationMin * 60000).getHours();
  }
  if (key === 'dayShift') {
    var a = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    var b = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
    return Math.round((a - b) / 86400000);
  }
  if (key === 'missing') return rec.missing.join(',');
  return rec[key];
}

function runTests() {
var rows = document.getElementById('rows');
var passed = 0;

CASES.forEach(function (testCase) {
  var records = Parser.parse(testCase.input, NOW);
  var problems = [];

  if (records.length !== testCase.expect.length) {
    problems.push('מספר רשומות: ' + records.length + ' במקום ' + testCase.expect.length);
  }

  testCase.expect.forEach(function (expected, index) {
    var rec = records[index];
    if (!rec) return;
    Object.keys(expected).forEach(function (key) {
      var actual = actualValue(rec, key);
      if (actual !== expected[key]) {
        problems.push('[' + index + '] ' + key + ' = ' + JSON.stringify(actual) + ' במקום ' + JSON.stringify(expected[key]));
      }
    });
  });

  var ok = problems.length === 0;
  if (ok) passed++;

  var summary = records.map(function (rec) {
    var date = new Date(rec.ts);
    return rec.type + ' | ' + rec.name + ' | amount=' + rec.amount + ' ' + (rec.unit || '') +
      ' | min=' + rec.durationMin + ' steps=' + rec.steps +
      ' | meal=' + rec.meal + ' | ' + date.getDate() + '.' + (date.getMonth() + 1) + ' ' +
      date.getHours() + ':' + ('0' + date.getMinutes()).slice(-2) +
      ' | missing=' + rec.missing.join(',') + ' | note=' + rec.note;
  }).join('\n');

  var tr = document.createElement('tr');
  tr.className = ok ? 'pass' : 'fail';
  [ok ? 'עבר' : 'נכשל', testCase.input, problems.join(' ; '), summary].forEach(function (text, i) {
    var td = document.createElement('td');
    if (i === 3 || i === 2) {
      var code = document.createElement('code');
      code.textContent = text;
      code.style.whiteSpace = 'pre-wrap';
      td.appendChild(code);
    } else {
      td.textContent = text;
    }
    tr.appendChild(td);
  });
  rows.appendChild(tr);
});

document.getElementById('summary').textContent = 'עברו ' + passed + ' מתוך ' + CASES.length + ' בדיקות';
}
</script>
</body>
</html>
