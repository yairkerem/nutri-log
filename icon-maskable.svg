<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="יומן תזונה ואימונים">
  <!-- גרסת maskable: רקע מלא, והסמל מוקטן כדי להישאר בתוך אזור הבטוח (80% מרכזיים). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15a89b"/>
      <stop offset="1" stop-color="#0b5f58"/>
    </linearGradient>

    <g id="fork">
      <rect x="-19" y="-58" width="8" height="38" rx="4"/>
      <rect x="-4" y="-58" width="8" height="38" rx="4"/>
      <rect x="11" y="-58" width="8" height="38" rx="4"/>
      <rect x="-19" y="-33" width="38" height="22" rx="11"/>
      <rect x="-6.5" y="-16" width="13" height="66" rx="6.5"/>
    </g>

    <g id="dumbbell">
      <rect x="-29" y="-6.5" width="58" height="13" rx="6.5"/>
      <rect x="-49" y="-21" width="19" height="42" rx="7"/>
      <rect x="30" y="-21" width="19" height="42" rx="7"/>
      <rect x="-60" y="-13" width="12" height="26" rx="6"/>
      <rect x="48" y="-13" width="12" height="26" rx="6"/>
    </g>
  </defs>

  <rect width="192" height="192" fill="url(#bg)"/>

  <g transform="translate(96.5 95) scale(0.74)">
    <g transform="translate(0 -6) rotate(18)" fill="#ffffff">
      <use href="#fork"/>
    </g>

    <g transform="translate(0 38) rotate(-18)">
      <use href="#dumbbell" fill="#0c645d" stroke="#0c645d" stroke-width="11" stroke-linejoin="round"/>
      <use href="#dumbbell" fill="#ffffff"/>
    </g>
  </g>
</svg>
